name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client's generated types are required for both workspaces' typechecks below —
      # without this, @prisma/client resolves to its un-generated stub and every model-specific
      # query (prisma.testCase.findMany, etc.) fails to typecheck.
      - name: Generate Prisma client
        run: npm run prisma:generate -w server

      - name: Lint
        run: npm run lint

      # Each "build" script is `tsc` (server) / `tsc -b && vite build` (client) — typecheck and a
      # real production build in one step, matching how this project is actually shipped.
      - name: Build server (typecheck)
        run: npm run build -w server

      - name: Build client (typecheck + bundle)
        run: npm run build -w client

      # No .env / secrets needed here — src/test/setup.ts points DATABASE_URL at a fresh,
      # isolated SQLite file per test file (via prisma db push), and config/env.ts's dev-only
      # secret fallbacks apply outside NODE_ENV=production, which Jest never sets.
      - name: Run server test suite
        run: npm test
