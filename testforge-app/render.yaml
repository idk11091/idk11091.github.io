# Render Blueprint for the TestForge API.
#
# Render reads this file when you create a "Blueprint" from the repo and pre-fills the
# service for you. The database is NOT defined here — it lives on Neon (Postgres), and its
# connection string is supplied via the DATABASE_URL env var below.
#
# This repo is an npm-workspaces monorepo (root + `server` + `client`), so install and build
# run from the repo root and target the `server` workspace explicitly, rather than pointing
# Render at a rootDir (which would break workspace dependency resolution).
services:
  - type: web
    name: testforge-api
    runtime: node
    plan: free

    # `prisma db push` (rather than `migrate deploy`) is deliberate: the existing migration
    # files are SQLite-era SQL and the database was created by a push, so it has no Prisma
    # migration history to apply against. Push is idempotent — a deploy whose schema is
    # unchanged is a no-op. Note it is intentionally NOT given --accept-data-loss, so a
    # deploy that would drop a column fails loudly instead of silently destroying data.
    buildCommand: >-
      npm install &&
      npx prisma generate --schema server/prisma/schema.prisma &&
      npx prisma db push --schema server/prisma/schema.prisma &&
      npm run build -w server

    startCommand: node server/dist/server.js

    # Render restarts the service if this stops returning 2xx.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # The deployed frontend's origin (scheme + host, no path). Comma-separate to allow
      # more than one. This is what the server's CORS allowlist checks against.
      - key: CLIENT_ORIGIN
        value: https://idk11091.github.io

      # Secrets — set these in the Render dashboard. `sync: false` keeps them OUT of this
      # file (and therefore out of git) while still declaring that the service needs them.
      #   DATABASE_URL      -> the Neon connection string
      #   JWT_ACCESS_SECRET -> a long random string (the server refuses to boot in
      #                        production without it, rather than using a dev fallback)
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
