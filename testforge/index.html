<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/testforge/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TestForge</title>
    <script>
      // Restores a deep link the portfolio's root 404.html encoded as
      // /testforge/?/projects back into /testforge/projects before React mounts.
      (function () {
        var q = window.location.search;
        if (q.charAt(1) === '/') {
          var route = q.slice(2).split('&').map(function (part) {
            return part.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '',
            window.location.pathname.replace(/\/$/, '') + '/' + route + window.location.hash);
        }
      })();
    </script>
    <script type="module" crossorigin src="/testforge/assets/index-B7zmqzpI.js"></script>
