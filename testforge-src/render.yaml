# Render Blueprint for the TestForge API (backend only).
# redeploy trigger: force Render to fetch the latest commit (node16 tsconfig fix)
# The frontend is served separately from GitHub Pages; the database is Neon Postgres,
# supplied via the DATABASE_URL env var below (not defined here).
services:
  - type: web
    name: testforge-api
    runtime: node
    plan: free
    # npm-workspaces monorepo: install/build from the repo root, target `server`.
    # `prisma db push` (not migrate deploy) because the DB was created by a push and has
    # no Prisma migration history; push is idempotent and won't drop data (no --accept-data-loss).
    buildCommand: >-
      npm install &&
      npx prisma generate --schema server/prisma/schema.prisma &&
      npx prisma db push --schema server/prisma/schema.prisma &&
      npm run build -w server
    startCommand: node server/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://idk11091.github.io
      # Secrets — set in the Render dashboard (sync:false keeps them out of git):
      #   DATABASE_URL      -> the Neon connection string
      #   JWT_ACCESS_SECRET -> a long random string (server refuses to boot without it in prod)
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
